name: Feature request
description: Propose a focused product improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, including keyboard behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Data, privacy, and compatibility impact
      description: Note schema, migration, network, permission, import/export, or backup implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
